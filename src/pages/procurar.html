<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../js/tema.js"></script>
  <script type="module" src="../js/auth.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="../css/procurar.css">
  <link rel="stylesheet" href="../css/tema.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
  <script type="module" src="../js/procurar.js" defer></script>
  <title>Procurar objetos</title>
</head>
<body>
<header>
   <div id="header-container"></div>
    </header>

  <main>
      <form id="formulario" method="get">
        <h2 id="titulo-formulario">Filtragem de Objetos</h2>
        <input type="text" name="titulo" id="item" placeholder="O que procura?">
        <input type="text" name="local" id="local" placeholder="Em qual cidade perdeu?">
        <select id="selecaoClasse" name="classe">
          <option disabled selected>Selecione uma classe</option>
        </select>
        <select id="selecaoTipo" name="tipo">
          <option disabled selected>Selecione um tipo</option>
        </select>
        <input type="date" name="data" id="data">
        <div class="radio-toggle-group">
          <input type="radio" name="tipoDePesquisa" id="exata" value="true" checked>
          <label for="exata">
            <i class="fas fa-bullseye"></i>
            <span>Pesquisa Exata</span>
          </label>

          <input type="radio" name="tipoDePesquisa" id="aproximada" value="false">
          <label for="aproximada">
            <i class="fas fa-search"></i>
            <span>Pesquisa Aproximada</span>
          </label>
        </div>


        <div class="meus_btns">
          <button type="reset" id="limparDados"><i class="fas fa-trash"></i></button>
          <button id="btnPesquisar" type="submit">Pesquisar</button>
          
        </div>
      </form>
  </main>

  <h2 id="tituloObjetoPostados"></h2>
  <section id="postagens">
  <!-- Aqui vão ficar os itens perdidos de acordo com o filtro (Usando Java Script)-->
  </section>


  <!-- RODAPÉ -->
  <footer id="final-da-pagina"> 
      <nav>
          <ul>
              <li><a href="#"><b>Instagram</b></a></li>
            <li><a href="#"><b>Facebook</b></a></li>
          </ul>
      </nav>
          <p class="rodape-direitos"><b>Copyright © 2025 – Todos os Direitos Reservados.</b></p>
  </footer>
 <script>
    fetch('../components/header.html')
    .then(response => response.text())
    .then(data => {
        document.getElementById('header-container').innerHTML = data;
    });
</script>

</body>
</html>
