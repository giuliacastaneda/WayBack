<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/tema.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <link rel="stylesheet" href="../css/objetoMobileStyle.css" media="(max-width: 800px)">
    <link rel="stylesheet" href="../css/objetoDesktopStyle.css" media="(min-width: 801px)">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400&display=swap" rel="stylesheet">
    <script type="module" src="../js/objetoScript.js" defer></script>
    <link rel="stylesheet" href="../css/tema.css" />
    <title>Objeto</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
</head>
<body>
  <header>
   <div id="header-container"></div>
    </header>
  
    <article class="dados-gerais">
        <h2 id="titulo"></h2>
        <img id="imagem" src="#" alt="img-objeto">
        <div class="botoes">
            <a id="btn-reportar" title="Reportar por conteúdo enganoso ou duplicado">
                <i  class="fa-regular fa-flag"></i> <!-- Ícone de alerta -->
            </a>
            <a id="btn-amei" title="Adicionar aos favoritos">
                <i class="fa-regular fa-heart"></i> <!-- Ícone de amei -->  
            </a>
            <a id="btn-compartilhar" title="Compartilhar conteúdo">
                <i class="fa-regular fa-share-from-square"></i> <!-- Ícone de compartilhar -->  
            </a>
        </div>
        <div class="info">
            <div class="classe">
                <h3>Classe</h3>
                <hr>
                <p id="field_classe"></p>
            </div>
            <div class="tipo">
                <h3>Tipo</h3>
                <hr>
                <p id="field_tipo"></p>
            </div>
            <div class="local-encontrado">
                <h3>Local Encontrado</h3>
                <hr>
                <p id="field_local"></p>
            </div>
            <div class="data-encontrada">
                <h3>Data Encontrada</h3>
                <hr>
                <p id="field_data"></p>
            </div>
            <div class="descricao">
                <h3>Descrição</h3>
                <hr>
                <p id="field_descricao"></p>
            </div>
        </div>
        <button id="btn-chat" type="button" style="color: black;" title="Conversar com a pessoa que encontrou este item">
            Conversar com Finder
            &nbsp;&nbsp;&nbsp;
            <i class="fa-regular fa-comment-dots" style="color: black;"></i>
        </button>
    </article>
    <footer> 
       <h4>
         <nav>
            <ul>
                <li><a href="#">Instagram</a></li>
                <li><a href="#">Facebook</a></li>
            </ul>
        </nav>
         <p class="rodape-direitos">Copyright © 2025 – Todos os Direitos Reservados.</p></h4>
    </footer>
    <script>
    fetch('../components/header.html')
    .then(response => response.text())
    .then(data => {
        document.getElementById('header-container').innerHTML = data;
    });
</script>
</body>
</html>
