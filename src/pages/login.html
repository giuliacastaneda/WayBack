<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="../js/tema.js"></script>
  <title>Login | Wayback</title>
  <script type="module" src="../js/validarSenha.js"></script>
  <script type="module" src="../js/auth.js"></script>
  <script src="../js/login.js"></script>
  <link rel="icon" type="image/png" sizes="32x32" href="https://cdn.glitch.global/8ff313da-1dcc-45d6-8163-d9dda5d323f1/favicon-32x32.png?v=1744744460894">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/tema.css" />
  
</head>
<body>
  <header>
   <div id="header-container"></div>
  </header>

  <main>
    <h1>LOGIN</h1>
    <form onsubmit="event.preventDefault(); alert('Login enviado!');">
      <div>
        <label for="email">Email</label><br />
        <input type="email" id="email" name="email" required />
      </div>
      <div>
        <label for="senha">Senha</label><br />
        <input type="password" id="senha" name="senha" required />
      </div>
      <button type="submit" class="btn-login">Login</button>
    </form>

    <hr />
<div class="links" style="justify-content: center;">
  <a href="../pages/cadastrar.html">Cadastre-se</a>
</div>
  </main>

  <footer> 
    <nav>
      <ul>
        <li><a href="#">Instagram</a></li>
        <li><a href="#">Facebook</a></li>
      </ul>
    </nav>
    <p class="rodape-direitos">Copyright © 2025 – Todos os Direitos Reservados.</p>
  </footer>
<script>
    fetch('../components/header.html')
    .then(response => response.text())
    .then(data => {
        document.getElementById('header-container').innerHTML = data;
    });
</script>
</body>
</html>
