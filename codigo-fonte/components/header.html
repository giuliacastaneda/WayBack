<header id="header-container" class="header">
      <a href="../home/"> <img id="logo" src="../assets/img/apple-touch-icon.png" alt="Logo Wayback" ></a>
      <a id="icon-bars" onclick="if (document.querySelector('.menu').classList.contains('ativado')) 
        {document.querySelector('.menu').classList.add('desativado'); document.querySelector('.menu').classList.remove('ativado'); 
        setTimeout(() => {document.querySelector('.menu').classList.remove('desativado'); document.body.style.overflow = ''}, 350);}
        else {document.body.style.overflow = 'hidden';document.querySelector('.menu').classList.remove('desativado'); 
        document.querySelector('.menu').classList.add('ativado');};
        document.querySelector('.fa-bars').classList.toggle('fa-xmark');"><i class="fa-solid fa-bars"></i></a>
      <div class="menu">
        <nav class="opcoes">
            <a href="../procurar/" class="fa fa-search" aria-hidden="true">&nbsp;&nbsp;PROCURAR</a>  
            <a href="../publicar/" class="fa fa-paper-plane" aria-hidden="true">&nbsp;&nbsp;PUBLICAR</a>
            <a href="../perfil/" class="fa fa-user" aria-hidden="true">&nbsp;&nbsp;PERFIL</a>
        </nav>
        <script>
            const usuario = JSON.parse(localStorage.getItem("usuarioLogado"));
            const btn_login = document.createElement("a");
            btn_login.id = "btn_login";
            btn_login.innerHTML = (usuario) ?
            "<i class='fa-solid fa-arrow-right-from-bracket'>&nbsp;&nbsp;LOGOUT</i>" 
            : "<i class='fa-solid fa-lock'>&nbsp;&nbsp;LOGIN</i>";
            document.querySelector(".menu").appendChild(btn_login);
        </script>
        <i class="fa-solid fa-moon" title="Modo Escuro ou Claro" id="alternar-tema"></i>
      </div>
    </header>

<style>
       
.header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 80px;
  padding: 5px 30px;
  background-color: var(--cor-marrom);
  background-size: 200% 200%;
  box-shadow: 0 8px 20px var(--cor-da-sombra);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 1000;
  transition: background 0.5s ease;
}

#logo {
  height: 80px;
  width: auto;
}

#icon-bars {
  display: none;
  font-size: 24px;
  color: var(--cor-branca);
  transition: transform 0.3s;
  z-index: 10;
}

#icon-bars:hover {
  transform: scale(1.2);
}

.menu {
  display: flex;
  flex-direction: row;
  column-gap: 50px;
}

.menu > * {
  font-size: clamp(12px, 1vw, 16px);
  color: black;
  transition: color 0.3s ease;
}

.menu nav *:hover {
  color: var(--cor-primaria-amarelo);
}

#btn_login {
  background: var(--cor-amarelo-gradiente);
  border-radius: 10px;
  padding: 10px 20px;
  text-decoration: none;
  letter-spacing: 2px;
  font-weight: bold;
  transition: all 0.3s ease;
  box-shadow: 0 4px 8px var(--cor-da-sombra);
}

#btn_login:hover {
  transform: translateY(-2px);
}

.opcoes {
  display: flex;
  flex-direction: row;
  align-items: center;
  letter-spacing: 2px;
  column-gap: 40px;
}

.opcoes > a {
  position: relative;
  padding: 10px 0px;
  text-decoration: none;
  color: var(--cor-branca);
}

.opcoes > a::after {
  position: absolute;
  content: "";
  background-color: var(--cor-primaria-amarelo);
  height: 2px;
  width: 0;
  bottom: 0;
}

.opcoes > a:hover::after {
  animation: navBarAnimation 0.3s linear forwards;
}

@keyframes navBarAnimation {
  from {
    left: 50%;
    width: 0%;
  }
  to {
    left: 0%;
    width: 100%;
  }
}

@media (max-width: 800px) {
  .menu {
    display: none;
  }

  #icon-bars {
    display: inline;
  }
  
  .ativado *, .desativado * {
    color: var(--cor-preto) !important;
  }
  
  .ativado, .desativado {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    row-gap: 40px;
    position: fixed;
    background-color: var(--cor-cinza-transparente);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--cor-cinza-transparente);
    top: 0;
    right: 0;
    width: 100vw;
    height: 100vh;
  }
  
  .ativado {
    animation: deslizarParaEsquerda 0.4s ease-out;
  }
  
  .desativado {
    animation: deslizarParaDireita 0.4s ease-out forwards;
  }
  
  
  /* conteiner contendo os link de paginas */
  .opcoes {
    display: flex;
    flex-direction: column;
    row-gap: 40px;
    width: 50%;
    padding: 5px;
  }

  /* btn de login para celular */
  #btn_login {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    width: 50%;
  }
}

@keyframes deslizarParaEsquerda {
  from {
    transform: translateX(100%);
  }
  to {
    transform: translateX(0);
  }
}

@keyframes deslizarParaDireita {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(100%);

  }
}

.fa-moon {
  font-size: 15px;
  color: var(--cor-branca);
  border: 2px solid ;
  padding: 10px 10px;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 0 8px var(--cor-da-sombra);  
}

.fa-sun {
 font-size: 15px;
  color: var(--cor-branca);
  border: 2px solid ;
  padding: 10px 10px;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 0 8px var(--cor-branca);  
}
</style>

<script>
  if (!localStorage.getItem("tema")) {
  localStorage.setItem("tema", "claro");
  }
const corTema = localStorage.getItem("tema");

// Cria o link do tema e adiciona ao head
const linkTema = document.createElement("link");
linkTema.setAttribute("rel", "stylesheet");
linkTema.setAttribute("id", "tema-css");
linkTema.setAttribute("href", corTema === "claro" ? "temaClaro.css" : "temaEscuro.css");
document.head.appendChild(linkTema);

// Aguarda o DOM carregar para manipular o ícone
document.addEventListener("DOMContentLoaded", () => {
    const botaoTema = document.getElementById("alternar-tema");

    // Ajusta o ícone de acordo com o tema atual
    if (corTema === "claro") {
        botaoTema.classList.remove("fa-sun");
        botaoTema.classList.add("fa-moon");
    } else {
        botaoTema.classList.remove("fa-moon");
        botaoTema.classList.add("fa-sun");
    }

    // Evento de clique para alternar tema e ícone
    botaoTema.addEventListener("click", () => {
        const temaAtual = localStorage.getItem("tema");
        const novoTema = temaAtual === "claro" ? "escuro" : "claro";
        localStorage.setItem("tema", novoTema);

        // Alterna ícones
        botaoTema.classList.toggle("fa-moon");
        botaoTema.classList.toggle("fa-sun");

        // Atualiza o CSS do tema
        const link = document.getElementById("tema-css");
        link.setAttribute("href", novoTema === "claro" ? "temaClaro.css" : "temaEscuro.css");
    });
});
</script>
